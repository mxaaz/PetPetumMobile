name: Scheduled rebuild (odsłanianie datowanych postów)

# Strona buduje się sama tylko na push. Posty mają przyszłe daty + future:false,
# więc bez codziennego rebuildu nie pojawiłyby się w swoim dniu.
# Ten workflow raz dziennie wymusza rebuild GitHub Pages (legacy branch build),
# dzięki czemu post z datą która właśnie minęła staje się widoczny.

on:
  schedule:
    # 07:15 UTC = ~09:15 czasu PL; posty są datowane na 09:00 +0200 (07:00 UTC),
    # więc o 07:15 UTC ich data jest już przeszła i build je odsłoni.
    - cron: "15 7 * * *"
  workflow_dispatch: {} # ręczne odpalenie do testu (Actions -> ten workflow -> Run)

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Wymuś build GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
