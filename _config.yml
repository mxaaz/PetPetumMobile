title: ApkaŁapka
description: Aplikacja do opieki nad psem i kotem. Porady, zdrowie pupila i nowości w aplikacji.
url: "https://apkalapka.pl"
lang: pl

permalink: /blog/:title/

# false = posty z przyszłą datą są UKRYTE do dnia publikacji (drip).
# Codzienny rebuild (.github/workflows/scheduled-rebuild.yml) odsłania je gdy nadejdzie ich data.
future: false

# Rytm publikacji postów (jedyne źródło prawdy; skill blog-content i scripts/reschedule_posts.py
# czytają stąd). Zmieniasz rytm: popraw tu i uruchom `python3 scripts/reschedule_posts.py --apply`.
drip_interval_days: 4
drip_time: "09:00:00 +0200"

# Pluginy whitelisted na GitHub Pages (zero CI)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /feed.xml

# Domyślne front-matter dla wpisów
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post

# Nie przetwarzaj plików niepotrzebnych przez Jekyll
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - app-ads
  - vendor
  - scripts
  - .gitignore

# Kategorie (do filtrowania / changelog)
category_labels:
  changelog: "Nowości w aplikacji"
  porady: "Porady"
  zdrowie: "Zdrowie pupila"
  spolecznosc: "Poznajcie pupili"
