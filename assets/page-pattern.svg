<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Wzór tła strony: łapki i drobne listki zielonym tuszem na kremie.
       Kafel 260x260 powtarzany przez CSS, jedna warstwa. Elementy w różnych skalach
       i obrotach, rozmieszczone nierównomiernie, żeby powtórzenie nie układało się
       w widoczną siatkę. Kolor i krycie na sztywno, bo tło strony jest zawsze kremowe. -->
  <defs>
    <g id="paw">
      <circle cx="-15" cy="-6" r="5.4"/>
      <circle cx="-4.5" cy="-14" r="5.4"/>
      <circle cx="7" cy="-12.5" r="5.4"/>
      <circle cx="17" cy="-3" r="5.4"/>
      <ellipse cx="1" cy="11" rx="14.5" ry="11.5"/>
    </g>
    <path id="leaf" d="M0 0c19 2 32 15 34 34C15 32 2 19 0 0z"/>
  </defs>

  <g fill="#5B8266" fill-opacity="0.30">
    <use href="#paw" transform="translate(44 38) rotate(-14) scale(0.86)"/>
    <use href="#paw" transform="translate(178 66) rotate(21) scale(0.62)"/>
    <use href="#paw" transform="translate(104 132) rotate(-6) scale(1.02)"/>
    <use href="#paw" transform="translate(226 158) rotate(38) scale(0.7)"/>
    <use href="#paw" transform="translate(28 196) rotate(9) scale(0.74)"/>
    <use href="#paw" transform="translate(150 232) rotate(-27) scale(0.9)"/>
    <use href="#paw" transform="translate(246 12) rotate(-33) scale(0.5)"/>
  </g>

  <g fill="#5B8266" fill-opacity="0.22">
    <use href="#leaf" transform="translate(212 96) rotate(31) scale(0.62)"/>
    <use href="#leaf" transform="translate(62 100) rotate(-58) scale(0.46)"/>
    <use href="#leaf" transform="translate(120 178) rotate(148) scale(0.4)"/>
    <use href="#leaf" transform="translate(4 138) rotate(74) scale(0.52)"/>
  </g>
</svg>
